{% set name = "meeko" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/meeko-{{ version }}.tar.gz
  sha256: 09a892bd796c1e1b72b73305f36b694cad99993d6f96acd85bb8d9341bc149d8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9,<3.14
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.9,<3.14
    - numpy
    - scipy
    - rdkit
    - gemmi
    - prody

test:
  imports:
    - meeko
  commands:
    - mk_export.py --help
    - mk_prepare_ligand.py --help
    - mk_prepare_receptor.py --help

about:
  home: https://github.com/ccsb-scripps/meeko
  summary: Python package for preparing small molecule for docking
  license: LGPL-2.1-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nbruciaferri
    - diogomart
